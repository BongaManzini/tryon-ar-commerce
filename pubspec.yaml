name: tryon
description: "A production-grade Flutter Virtual Try-On and AR Commerce application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # Camera & Gallery Access
  camera: ^0.10.5+9
  image_picker: ^1.0.7

  # On-Device Segmentation & Vision
  google_mlkit_selfie_segmentation: ^0.7.0
  google_mlkit_barcode_scanning: ^0.11.0
  image: ^4.1.7

  # Live AR Layer
  ar_flutter_plugin: ^0.7.3

  # Local Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Commerce & Networking
  dio: ^5.4.1
  url_launcher: ^6.2.5
  app_links: ^6.0.1

  # WebGL & 3D Interactive Viewport
  webview_flutter: ^4.7.0

  # Utilities
  vector_math: ^2.1.4
  uuid: ^4.3.3
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
    - assets/three/
